name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTMC_WARNINGS_AS_ERRORS=ON
          -DFASTMC_BUILD_BENCHMARKS=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure

  python-bindings:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pybind11
      - id: pybind11
        shell: bash
        run: echo "dir=$(python -m pybind11 --cmakedir)" >> "$GITHUB_OUTPUT"
      - run: >-
          cmake -S . -B build-python -DCMAKE_BUILD_TYPE=Release
          -DFASTMC_BUILD_PYTHON=ON
          -DFASTMC_WARNINGS_AS_ERRORS=ON
          -Dpybind11_DIR=${{ steps.pybind11.outputs.dir }}
      - run: cmake --build build-python --config Release --parallel
      - run: ctest --test-dir build-python --build-config Release --output-on-failure
